<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiln Control example</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kiln-control.css">
</head>
<body style="padding:16px;max-width:420px">
<article class="kc-plate">
  <header class="kc-plate__head"><span class="kc-label">Thu Nov 13 · 9:00am</span><span class="kc-status" data-status="proposed">Proposed</span></header>
  <div class="kc-plate__body">
    <h2 class="kc-title">Cone 6 glaze</h2>
    <div>
      <span class="kc-meter" style="--fill:75" role="img" aria-label="75% full"><span class="kc-meter__track"><span class="kc-meter__bar"></span></span></span>
      <div class="kc-meter-caption"><span>75% full</span><span>Room for 25%</span></div>
    </div>
    <div class="kc-keys kc-keys--fill"><a class="kc-key kc-key--fire" href="#">Request space</a><a class="kc-key" href="#">Details</a></div>
  </div>
</article>
</body>
</html>
