name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kilnlab
          POSTGRES_PASSWORD: kilnlab
          POSTGRES_DB: kilnlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kilnlab -d kilnlab_test"
          --health-interval 4s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kilnlab:kilnlab@localhost:5432/kilnlab_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: sqlc generated code is up to date
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - run: go vet ./...
      - run: go test -p 1 -count=1 ./...
      - run: go build -o /tmp/kilnlab ./cmd/server

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install, type-check, build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
